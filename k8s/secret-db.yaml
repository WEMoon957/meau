# MySQL 数据库凭证（腾讯云 TDSQL-C MySQL 外网地址）
# 通过 K8s Secret 注入到应用容器，避免明文写在镜像/ConfigMap 中
#
# 占位符均为 base64 编码，部署前必须替换为真实值：
#   echo -n 'sh-cynosdbmysql-grp-nwl19gmw.sql.tencentcdb.com' | base64
#
# 注意：DB_PASSWORD 中的特殊字符（如 Aa!211719 的 !）base64 后无影响，
#       但 YAML 中字符串必须用引号包裹以防 ":" 被解析。
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: meau
type: Opaque
stringData:
  # 直接写明文，K8s 自动 base64 编码存储（stringData 比 data 更易维护）
  DB_HOST: sh-cynosdbmysql-grp-nwl19gmw.sql.tencentcdb.com
  DB_PORT: "24693"
  DB_USER: root
  DB_PASSWORD: Aa!211719
  DB_NAME: flask_demo
