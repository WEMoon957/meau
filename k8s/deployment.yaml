# 应用 Deployment + Service（NodePort）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meau
  namespace: meau
  labels:
    app: meau
    app.kubernetes.io/part-of: meau
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: meau
  template:
    metadata:
      labels:
        app: meau
        app.kubernetes.io/part-of: meau
    spec:
      containers:
        - name: meau
          # TODO: 替换为你的私有镜像仓库地址
          image: REPOSITORY/meau:TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          # 从 Secret + ConfigMap 注入环境变量
          envFrom:
            # 1. 非敏感配置
            - configMapRef:
                name: app-config
            # 2. MySQL 凭证
            - secretRef:
                name: db-credentials
            # 3. 应用敏感凭证（LLM Key、收钱吧私钥等）
            - secretRef:
                name: app-credentials
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # 健康检查：命中 /api/health（含 DB/Redis/KB 探活）
          # 与 Dockerfile 的 HEALTHCHECK 一致
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          # 优雅关停：gunicorn 收到 SIGTERM 后等待 in-flight 请求处理完
          # K8s 删除 Pod 时先发 SIGTERM，等 terminationGracePeriodSeconds 后 SIGKILL
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "gunicorn -c /app/gunicorn_conf.py --graceful-timeout 60 stop"]
      terminationGracePeriodSeconds: 90
---
# Service：NodePort 暴露
# 访问方式：节点IP:30080
# 注意：NodePort 范围默认 30000-32767
apiVersion: v1
kind: Service
metadata:
  name: meau
  namespace: meau
  labels:
    app: meau
    app.kubernetes.io/part-of: meau
spec:
  type: NodePort
  selector:
    app: meau
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
      name: http
