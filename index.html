<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 菜单推荐</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 16px 24px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .header .reset-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .header .reset-btn:hover { background: rgba(255,255,255,0.35); }
        .chat-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background: #fbfbfd;
        }
        .msg { margin-bottom: 14px; display: flex; }
        .msg.user { justify-content: flex-end; }
        .msg .bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg.user .bubble { background: #667eea; color: #fff; }
        .msg.assistant .bubble { background: #fff; border: 1px solid #eef0f4; }
        .msg.error .bubble { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; }
        .msg.loading .bubble { background: #fff; border: 1px solid #eef0f4; color: #999; }
        .msg.assistant .bubble .r-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .msg.assistant .bubble .r-warning { background: #fff8e1; border-left: 3px solid #ffb300; padding: 8px 12px; margin-bottom: 10px; border-radius: 4px; color: #6a4f00; font-size: 13px; }
        .msg.assistant .bubble .r-cat { font-size: 13px; font-weight: 600; color: #667eea; margin: 10px 0 6px; padding-bottom: 4px; border-bottom: 1px dashed #e6e8f0; }
        .msg.assistant .bubble .r-dish { display: flex; align-items: baseline; padding: 4px 0; font-size: 14px; }
        .msg.assistant .bubble .r-dish .r-idx { width: 24px; color: #999; flex-shrink: 0; }
        .msg.assistant .bubble .r-dish .r-name { flex: 1; color: #333; }
        .msg.assistant .bubble .r-dish .r-price { color: #e67e22; font-weight: 600; margin: 0 8px; }
        .msg.assistant .bubble .r-dish .r-spicy { color: #e74c3c; font-size: 12px; }
        .msg.assistant .bubble .r-dish .r-sig { color: #f39c12; font-size: 12px; margin-left: 6px; }
        .msg.assistant .bubble .r-total { margin-top: 12px; padding: 8px 12px; background: #f5f7fa; border-radius: 6px; font-size: 15px; font-weight: 700; color: #333; }
        .msg.assistant .bubble .r-reason { margin-top: 10px; padding: 10px 12px; background: #f0f4ff; border-left: 3px solid #667eea; border-radius: 4px; font-size: 13px; color: #444; line-height: 1.7; }
        .msg.assistant .bubble .r-rule { margin-top: 10px; padding: 8px 12px; background: #fff6f6; border-left: 3px solid #e74c3c; border-radius: 4px; font-size: 12px; color: #c0392b; line-height: 1.6; }
        .msg.assistant .bubble .r-tip { margin-top: 10px; font-size: 12px; color: #999; text-align: center; }
        .msg.assistant .bubble .r-text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
        .empty { text-align: center; color: #999; font-size: 13px; padding: 20px; }
        .input-bar {
            display: flex;
            gap: 10px;
            padding: 16px 24px;
            border-top: 1px solid #eef0f4;
            background: #fff;
            flex-shrink: 0;
        }
        .input-bar textarea {
            flex: 1;
            min-height: 60px;
            max-height: 120px;
            padding: 10px 12px;
            border: 1px solid #dde1e7;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
        }
        .input-bar textarea:focus { border-color: #667eea; }
        .input-bar button {
            padding: 0 22px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-bar button:hover { background: #5568d3; }
        .input-bar button:disabled { background: #b8bfd1; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>AI 菜单推荐</h1>
                <p>输入你想吃的内容，AI 会推荐相关菜品</p>
            </div>
            <button class="reset-btn" onclick="resetChat()" title="重置对话">新对话</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="empty">暂无消息，开始聊天吧</div>
        </div>

        <div class="input-bar">
            <textarea id="messageInput" placeholder="输入消息，例如：我们X个人，不爱/爱吃辣，有小孩..."></textarea>
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatArea = document.getElementById('chatArea');

        // ========== 修改：后端 API 地址 ==========
        const API_URL = 'http://127.0.0.1:3000/api/ai/chat';
        const RESET_URL = 'http://127.0.0.1:3000/api/ai/reset';

        // ========== 关键：保存 session_id 用于连续对话 ==========
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        let sessionId = generateUUID();

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatAssistantHtml(text) {
            const lines = text.split('\n');
            const html = [];
            let parsed = false;
            let i = 0;

            if (lines.length && /为您推荐以下菜品/.test(lines[0])) {
                html.push(`<div class="r-title">${escapeHtml(lines[0])}</div>`);
                i = 1;
                parsed = true;
            }

            for (; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                if (!trimmed) continue;

                if (!parsed && /警告|提示|无法|没有合适/.test(trimmed) && !trimmed.startsWith('---')) {
                    html.push(`<div class="r-warning">${escapeHtml(trimmed)}</div>`);
                    continue;
                }

                const cat = trimmed.match(/^---\s*(.+?)\s*---$/);
                if (cat) {
                    html.push(`<div class="r-cat">${escapeHtml(cat[1])}</div>`);
                    parsed = true;
                    continue;
                }

                const dish = trimmed.match(/^(\d+)\.\s+(.+?)\s+￥([\d.]+)(\s*\[([^\]]+)\])?(\s*★招牌)?$/);
                if (dish) {
                    let idx = dish[1], name = dish[2], price = dish[3], spicy = dish[5], sig = dish[6];
                    if (!spicy && !sig) {
                        const next = (lines[i + 1] || '').trim();
                        const tagMatch = next.match(/^(\[([^\]]+)\])?\s*(★招牌)?$/);
                        if (tagMatch && (tagMatch[2] || tagMatch[3])) {
                            spicy = tagMatch[2];
                            sig = tagMatch[3];
                            i++;
                        }
                    }
                    html.push(
                        `<div class="r-dish">` +
                        `<span class="r-idx">${idx}.</span>` +
                        `<span class="r-name">${escapeHtml(name)}</span>` +
                        `<span class="r-price">￥${escapeHtml(price)}</span>` +
                        (spicy ? `<span class="r-spicy">[${escapeHtml(spicy)}]</span>` : '') +
                        (sig ? `<span class="r-sig">★招牌</span>` : '') +
                        `</div>`
                    );
                    parsed = true;
                    continue;
                }

                if (/^合计：/.test(trimmed)) {
                    html.push(`<div class="r-total">${escapeHtml(trimmed)}</div>`);
                    continue;
                }

                if (/^推荐理由：/.test(trimmed)) {
                    html.push(`<div class="r-reason">${escapeHtml(trimmed)}</div>`);
                    continue;
                }

                if (/(冲突|互斥|不宜搭配|搭配规则|警告)/.test(trimmed)) {
                    html.push(`<div class="r-rule">${escapeHtml(trimmed)}</div>`);
                    continue;
                }

                if (/如需调整|请告诉我/.test(trimmed)) {
                    html.push(`<div class="r-tip">${escapeHtml(trimmed)}</div>`);
                    continue;
                }

                if (parsed) {
                    html.push(`<div class="r-text">${escapeHtml(trimmed)}</div>`);
                } else {
                    html.push(`<div class="r-text">${escapeHtml(line)}</div>`);
                }
            }

            if (!parsed && html.length === 0) {
                return `<div class="r-text">${escapeHtml(text)}</div>`;
            }
            return html.join('');
        }

        function appendMessage(role, text) {
            const empty = chatArea.querySelector('.empty');
            if (empty) empty.remove();
            const msg = document.createElement('div');
            msg.className = 'msg ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'assistant') {
                bubble.innerHTML = formatAssistantHtml(text);
            } else {
                bubble.textContent = text;
            }
            msg.appendChild(bubble);
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
            return bubble;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            messageInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';
            const loadingBubble = appendMessage('loading', '正在思考...');

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // ========== 关键：始终带上 session_id ==========
                    body: JSON.stringify({ user_message: text, session_id: sessionId })
                });

                if (!resp.ok) {
                    const errText = await resp.text().catch(() => '无错误详情');
                    throw new Error(`请求失败 (HTTP ${resp.status})：${errText}`);
                }

                const data = await resp.json();
                // ========== 关键：保存后端返回的 session_id ==========
                if (data.session_id) {
                    sessionId = data.session_id;
                }

                const content =
                    data.aimessage ||
                    data.content ||
                    data.message ||
                    data.reply ||
                    data.result ||
                    JSON.stringify(data);

                loadingBubble.innerHTML = formatAssistantHtml(String(content));
                loadingBubble.parentElement.classList.remove('loading');
                loadingBubble.parentElement.classList.add('assistant');
            } catch (err) {
                let errMsg = err.message;
                if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    errMsg = '网络连接失败，请检查：\n1. 后端服务是否已启动\n2. 接口地址和端口是否正确\n3. 后端是否已配置跨域(CORS)';
                }
                loadingBubble.textContent = errMsg;
                loadingBubble.parentElement.classList.remove('loading');
                loadingBubble.parentElement.classList.add('error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        // ========== 新增：重置对话 ==========
        async function resetChat() {
            if (!sessionId) {
                chatArea.innerHTML = '<div class="empty">暂无消息，开始聊天吧</div>';
                return;
            }
            try {
                await fetch(RESET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
            } catch (e) {
                // 静默失败，前端也清空
            }
            // 清空前端的 sessionId 和聊天区域
            sessionId = '';
            chatArea.innerHTML = '<div class="empty">暂无消息，开始聊天吧</div>';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
