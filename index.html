<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 菜单推荐</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 16px 24px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .header .reset-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .header .reset-btn:hover { background: rgba(255,255,255,0.35); }

        .chat-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background: #fbfbfd;
        }
        .msg { margin-bottom: 14px; display: flex; }
        .msg.user { justify-content: flex-end; }
        .msg .bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg.user .bubble { background: #667eea; color: #fff; }
        .msg.assistant .bubble { background: #fff; border: 1px solid #eef0f4; }
        .msg.error .bubble { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; }
        .msg.loading .bubble { background: #fff; border: 1px solid #eef0f4; color: #999; }
        .msg.assistant .bubble .r-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .msg.assistant .bubble .r-warning { background: #fff8e1; border-left: 3px solid #ffb300; padding: 8px 12px; margin-bottom: 10px; border-radius: 4px; color: #6a4f00; font-size: 13px; }
        .msg.assistant .bubble .r-cat { font-size: 13px; font-weight: 600; color: #667eea; margin: 10px 0 6px; padding-bottom: 4px; border-bottom: 1px dashed #e6e8f0; }
        .msg.assistant .bubble .r-dish { display: flex; align-items: baseline; padding: 4px 0; font-size: 14px; }
        .msg.assistant .bubble .r-dish .r-idx { width: 24px; color: #999; flex-shrink: 0; }
        .msg.assistant .bubble .r-dish .r-name { flex: 1; color: #333; }
        .msg.assistant .bubble .r-dish .r-price { color: #e67e22; font-weight: 600; margin: 0 8px; }
        .msg.assistant .bubble .r-dish .r-spicy { color: #e74c3c; font-size: 12px; }
        .msg.assistant .bubble .r-dish .r-sig { color: #f39c12; font-size: 12px; margin-left: 6px; }
        .msg.assistant .bubble .r-total { margin-top: 12px; padding: 8px 12px; background: #f5f7fa; border-radius: 6px; font-size: 15px; font-weight: 700; color: #333; }
        .msg.assistant .bubble .r-reason { margin-top: 10px; padding: 10px 12px; background: #f0f4ff; border-left: 3px solid #667eea; border-radius: 4px; font-size: 13px; color: #444; line-height: 1.7; }
        .msg.assistant .bubble .r-rule { margin-top: 10px; padding: 8px 12px; background: #fff6f6; border-left: 3px solid #e74c3c; border-radius: 4px; font-size: 12px; color: #c0392b; line-height: 1.6; }
        .msg.assistant .bubble .r-tip { margin-top: 10px; font-size: 12px; color: #999; text-align: center; }
        .msg.assistant .bubble .r-text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
        .empty { text-align: center; color: #999; font-size: 13px; padding: 20px; }

        /* ===== 按键式交互面板 ===== */
        .panel {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #eef0f4;
        }
        .progress {
            display: flex;
            padding: 12px 24px 0;
            gap: 6px;
        }
        .progress .step {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: #eef0f4;
            transition: background 0.25s;
        }
        .progress .step.active { background: #667eea; }
        .progress .step.done { background: #a5b0e8; }

        .panel-body {
            padding: 14px 24px 8px;
        }
        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .panel-sub {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
        }
        .panel-sub .sel { color: #667eea; font-weight: 500; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
        .btn-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

        .opt-btn {
            padding: 10px 6px;
            border: 1px solid #dde1e7;
            background: #fff;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: all 0.18s;
            text-align: center;
            user-select: none;
        }
        .opt-btn:hover { border-color: #667eea; color: #667eea; }
        .opt-btn.selected {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }
        .opt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .panel-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 24px 16px;
        }
        .link-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 4px;
        }
        .link-btn:hover { color: #667eea; }
        .link-btn:disabled { color: #ccc; cursor: not-allowed; }

        .primary-btn {
            padding: 9px 22px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .primary-btn:hover { background: #5568d3; }
        .primary-btn:disabled { background: #b8bfd1; cursor: not-allowed; }

        .summary-bar {
            padding: 8px 24px;
            background: #f5f7fa;
            border-top: 1px solid #eef0f4;
            font-size: 12px;
            color: #666;
            min-height: 32px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .summary-bar .tag {
            background: #fff;
            border: 1px solid #e0e4ec;
            border-radius: 10px;
            padding: 2px 8px;
            color: #555;
        }
        .summary-bar .tag .x {
            color: #999;
            cursor: pointer;
            margin-left: 4px;
        }
        .summary-bar .tag .x:hover { color: #e74c3c; }
        .summary-bar .placeholder { color: #aaa; }

        /* ===== 确认下单输入区 ===== */
        .order-input-bar {
            display: flex;
            gap: 8px;
            padding: 10px 24px 14px;
            background: #fff;
            border-top: 1px solid #eef0f4;
        }
        .order-input-bar input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #dde1e7;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .order-input-bar input:focus { border-color: #667eea; }
        .order-input-bar button {
            padding: 9px 18px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .order-input-bar button:hover { background: #5568d3; }
        .order-input-bar button:disabled { background: #b8bfd1; cursor: not-allowed; }

        /* 加购结果气泡 */
        .msg.assistant .bubble .r-cart {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f9f0; border-left: 3px solid #27ae60;
            border-radius: 4px; font-size: 13px; color: #1e7e34; line-height: 1.7;
        }
        .msg.assistant .bubble .r-cart-fail {
            margin-top: 10px; padding: 10px 12px;
            background: #fff6f6; border-left: 3px solid #e74c3c;
            border-radius: 4px; font-size: 13px; color: #c0392b; line-height: 1.7;
        }
        .msg.assistant .bubble .r-cart-item {
            display: flex; justify-content: space-between;
            padding: 3px 0; font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>AI 菜单推荐</h1>
                <p>按步骤选择偏好，AI 为你定制推荐</p>
            </div>
            <button class="reset-btn" onclick="resetAll()" title="重新开始">重新开始</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="empty">选择下方选项，开始定制你的菜单</div>
        </div>

        <div class="panel">
            <div class="progress">
                <div class="step active" id="step-bar-1"></div>
                <div class="step" id="step-bar-2"></div>
                <div class="step" id="step-bar-3"></div>
            </div>

            <div class="panel-body" id="panelBody">
                <!-- 动态渲染 -->
            </div>

            <div class="panel-actions">
                <button class="link-btn" id="prevBtn" onclick="prevStep()">上一步</button>
                <button class="primary-btn" id="nextBtn" onclick="nextStep()">下一步</button>
            </div>

            <div class="summary-bar" id="summaryBar">
                <span class="placeholder">尚未选择任何项</span>
            </div>
            <div class="order-input-bar">
                <input id="orderInput" type="text" placeholder="输入「确认下单」把推荐加入购物车，或直接和我对话" onkeydown="if(event.key==='Enter')sendCustom()" />
                <button id="orderSendBtn" onclick="sendCustom()">发送</button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const panelBody = document.getElementById('panelBody');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const summaryBar = document.getElementById('summaryBar');

        // ========== 后端 API 地址 ==========
        // 使用相对路径，与后端同源（前端由 FastAPI 3000 端口提供），
        // 局域网/本地/任何主机名访问都能正常工作，无需修改。
        const API_URL = '/api/ai/chat';
        const RESET_URL = '/api/ai/reset';

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        // 会话凭证：session_id 与 session_token 均由后端签发（首次 chat 时返回）。
        // 前端不再自行生成 session_id，避免后端无法校验 token（C3 会话对象级鉴权）。
        // 401 时清空凭证，下一次 chat 自动创建新会话。
        let sessionId = '';
        let sessionToken = '';

        // ========== 选项配置 ==========
        const PEOPLE_OPTIONS = ['1人', '2人', '3人', '4人', '5人', '6人', '7人', '8人', '9人', '10人+'];
        const SPICY_OPTIONS = [
            { label: '不吃辣', value: '不吃辣' },
            { label: '微辣', value: '微辣' },
            { label: '中辣', value: '中辣' },
            { label: '特辣', value: '特辣' }
        ];
        const PREF_OPTIONS = [
            '有小孩', '有老人', '有素食者', '清淡口味', '下饭',
            '招牌菜', '不要香菜', '不要葱蒜', '海鲜过敏', '花生过敏'
        ];

        // ========== 状态 ==========
        const state = {
            step: 1,           // 1: 人数, 2: 辣度, 3: 偏好
            people: '',        // 单选
            spicy: '',         // 单选
            prefs: new Set(),  // 多选
            submitted: false
        };

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ========== 助手回复格式化（沿用旧逻辑） ==========
        function formatAssistantHtml(text) {
            const lines = text.split('\n');
            const html = [];
            let parsed = false;
            let i = 0;

            if (lines.length && /为您推荐以下菜品/.test(lines[0])) {
                html.push(`<div class="r-title">${escapeHtml(lines[0])}</div>`);
                i = 1;
                parsed = true;
            }

            for (; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                if (!trimmed) continue;

                if (!parsed && /警告|提示|无法|没有合适/.test(trimmed) && !trimmed.startsWith('---')) {
                    html.push(`<div class="r-warning">${escapeHtml(trimmed)}</div>`);
                    continue;
                }

                const cat = trimmed.match(/^---\s*(.+?)\s*---$/);
                if (cat) {
                    html.push(`<div class="r-cat">${escapeHtml(cat[1])}</div>`);
                    parsed = true;
                    continue;
                }

                const dish = trimmed.match(/^(\d+)\.\s+(.+?)\s+￥([\d.]+)(\s*\[([^\]]+)\])?(\s*★招牌)?$/);
                if (dish) {
                    let idx = dish[1], name = dish[2], price = dish[3], spicy = dish[5], sig = dish[6];
                    if (!spicy && !sig) {
                        const next = (lines[i + 1] || '').trim();
                        const tagMatch = next.match(/^(\[([^\]]+)\])?\s*(★招牌)?$/);
                        if (tagMatch && (tagMatch[2] || tagMatch[3])) {
                            spicy = tagMatch[2];
                            sig = tagMatch[3];
                            i++;
                        }
                    }
                    html.push(
                        `<div class="r-dish">` +
                        `<span class="r-idx">${idx}.</span>` +
                        `<span class="r-name">${escapeHtml(name)}</span>` +
                        `<span class="r-price">￥${escapeHtml(price)}</span>` +
                        (spicy ? `<span class="r-spicy">[${escapeHtml(spicy)}]</span>` : '') +
                        (sig ? `<span class="r-sig">★招牌</span>` : '') +
                        `</div>`
                    );
                    parsed = true;
                    continue;
                }

                if (/^合计：/.test(trimmed)) { html.push(`<div class="r-total">${escapeHtml(trimmed)}</div>`); continue; }
                if (/^推荐理由：/.test(trimmed)) { html.push(`<div class="r-reason">${escapeHtml(trimmed)}</div>`); continue; }
                if (/(冲突|互斥|不宜搭配|搭配规则|警告)/.test(trimmed)) { html.push(`<div class="r-rule">${escapeHtml(trimmed)}</div>`); continue; }
                if (/如需调整|请告诉我/.test(trimmed)) { html.push(`<div class="r-tip">${escapeHtml(trimmed)}</div>`); continue; }

                html.push(`<div class="r-text">${escapeHtml(trimmed)}</div>`);
            }

            if (!parsed && html.length === 0) {
                return `<div class="r-text">${escapeHtml(text)}</div>`;
            }
            return html.join('');
        }

        function appendMessage(role, text) {
            const empty = chatArea.querySelector('.empty');
            if (empty) empty.remove();
            const msg = document.createElement('div');
            msg.className = 'msg ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'assistant') {
                bubble.innerHTML = formatAssistantHtml(text);
            } else {
                bubble.textContent = text;
            }
            msg.appendChild(bubble);
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
            return bubble;
        }

        // ========== 步骤渲染 ==========
        function renderStep() {
            updateProgressBar();
            updateSummary();
            if (state.submitted) {
                panelBody.innerHTML = `
                    <div class="panel-title">已生成推荐</div>
                    <div class="panel-sub">如需调整，点击"重新开始"或修改选项后再次推荐</div>
                `;
                prevBtn.disabled = false;
                prevBtn.textContent = '修改选项';
                nextBtn.disabled = false;
                nextBtn.textContent = '再次推荐';
                return;
            }

            prevBtn.disabled = state.step === 1;
            prevBtn.textContent = '上一步';

            if (state.step === 1) {
                nextBtn.textContent = state.people ? '下一步' : '请先选择';
                nextBtn.disabled = !state.people;
                panelBody.innerHTML = `
                    <div class="panel-title">第 1 步：用餐人数</div>
                    <div class="panel-sub">选择当前用餐的人数</div>
                    <div class="btn-grid" id="peopleGrid"></div>
                `;
                const grid = document.getElementById('peopleGrid');
                PEOPLE_OPTIONS.forEach(opt => {
                    const b = document.createElement('button');
                    b.className = 'opt-btn' + (state.people === opt ? ' selected' : '');
                    b.textContent = opt;
                    b.onclick = () => { state.people = opt; renderStep(); };
                    grid.appendChild(b);
                });
            } else if (state.step === 2) {
                nextBtn.textContent = state.spicy ? '下一步' : '请先选择';
                nextBtn.disabled = !state.spicy;
                panelBody.innerHTML = `
                    <div class="panel-title">第 2 步：辣度偏好</div>
                    <div class="panel-sub">选择你能接受的辣度</div>
                    <div class="btn-grid cols-4" id="spicyGrid"></div>
                `;
                const grid = document.getElementById('spicyGrid');
                SPICY_OPTIONS.forEach(opt => {
                    const b = document.createElement('button');
                    b.className = 'opt-btn' + (state.spicy === opt.value ? ' selected' : '');
                    b.textContent = opt.label;
                    b.onclick = () => { state.spicy = opt.value; renderStep(); };
                    grid.appendChild(b);
                });
            } else if (state.step === 3) {
                nextBtn.textContent = '生成推荐';
                nextBtn.disabled = false;
                panelBody.innerHTML = `
                    <div class="panel-title">第 3 步：其他偏好</div>
                    <div class="panel-sub">可多选，也可跳过</div>
                    <div class="btn-grid cols-5" id="prefGrid"></div>
                `;
                const grid = document.getElementById('prefGrid');
                PREF_OPTIONS.forEach(opt => {
                    const b = document.createElement('button');
                    b.className = 'opt-btn' + (state.prefs.has(opt) ? ' selected' : '');
                    b.textContent = opt;
                    b.onclick = () => {
                        if (state.prefs.has(opt)) state.prefs.delete(opt);
                        else state.prefs.add(opt);
                        renderStep();
                    };
                    grid.appendChild(b);
                });
            }
        }

        function updateProgressBar() {
            [1, 2, 3].forEach(i => {
                const el = document.getElementById('step-bar-' + i);
                el.classList.remove('active', 'done');
                if (state.submitted || i < state.step) el.classList.add('done');
                else if (i === state.step) el.classList.add('active');
            });
        }

        function updateSummary() {
            const tags = [];
            if (state.people) tags.push({ key: 'people', label: state.people });
            if (state.spicy) tags.push({ key: 'spicy', label: state.spicy });
            state.prefs.forEach(p => tags.push({ key: 'pref:' + p, label: p }));

            if (tags.length === 0) {
                summaryBar.innerHTML = '<span class="placeholder">尚未选择任何项</span>';
                return;
            }
            summaryBar.innerHTML = tags.map(t =>
                `<span class="tag">${escapeHtml(t.label)}<span class="x" data-key="${escapeHtml(t.key)}">×</span></span>`
            ).join('');
            summaryBar.querySelectorAll('.tag .x').forEach(x => {
                x.onclick = (e) => {
                    const key = e.target.getAttribute('data-key');
                    removeTag(key);
                };
            });
        }

        function removeTag(key) {
            if (key === 'people') state.people = '';
            else if (key === 'spicy') state.spicy = '';
            else if (key.startsWith('pref:')) state.prefs.delete(key.slice(5));
            renderStep();
        }

        function nextStep() {
            if (state.submitted) {
                // 再次推荐
                state.submitted = false;
                renderStep();
                submitRecommend();
                return;
            }
            if (state.step === 1 && !state.people) return;
            if (state.step === 2 && !state.spicy) return;
            if (state.step < 3) {
                state.step++;
                renderStep();
            } else {
                submitRecommend();
            }
        }

        function prevStep() {
            if (state.submitted) {
                state.submitted = false;
                renderStep();
                return;
            }
            if (state.step > 1) {
                state.step--;
                renderStep();
            }
        }

        // ========== 组装消息并提交 ==========
        function buildMessage() {
            const parts = [];
            if (state.people) parts.push('我们' + state.people);
            if (state.spicy) parts.push(state.spicy);
            if (state.prefs.size > 0) parts.push([...state.prefs].join('、'));
            parts.push('请推荐合适的菜品');
            return parts.join('，');
        }

        async function submitRecommend() {
            const message = buildMessage();
            appendMessage('user', message);

            state.submitted = true;
            renderStep();

            const loadingBubble = appendMessage('loading', '正在为你定制推荐...');

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_message: message,
                        session_id: sessionId,
                        session_token: sessionToken
                    })
                });
                if (resp.status === 401) {
                    // 会话凭证失效（过期/被重置）：清空凭证，下一次 chat 自动创建新会话
                    sessionId = '';
                    sessionToken = '';
                    throw new Error('会话已过期，请重新选择并推荐');
                }
                if (!resp.ok) {
                    const errText = await resp.text().catch(() => '无错误详情');
                    throw new Error(`请求失败 (HTTP ${resp.status})：${errText}`);
                }
                const data = await resp.json();
                if (data.session_id) sessionId = data.session_id;
                // 新会话时后端返回 session_token；已有会话返回空（沿用旧 token）
                if (data.session_token) sessionToken = data.session_token;
                const content =
                    data.aimessage || data.content || data.message ||
                    data.reply || data.result || JSON.stringify(data);
                loadingBubble.innerHTML = formatAssistantHtml(String(content));
                loadingBubble.parentElement.classList.remove('loading');
                loadingBubble.parentElement.classList.add('assistant');
            } catch (err) {
                let errMsg = err.message;
                if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    errMsg = '网络连接失败，请检查：\n1. 后端服务是否已启动\n2. 接口地址和端口是否正确\n3. 后端是否已配置跨域(CORS)';
                }
                loadingBubble.textContent = errMsg;
                loadingBubble.parentElement.classList.remove('loading');
                loadingBubble.parentElement.classList.add('error');
            }
        }

        // ========== 统一入口：所有输入走 /api/ai/chat（方案 A：LLM 意图路由） ==========
        // 用户输入（推荐/加购/闲聊/咨询）统一发送到 /api/ai/chat，
        // 后端 OrderingAgent 用 LLM 识别意图并调用对应工具：
        //   - 推荐意图 → recommend_dishes
        //   - 加购/确认下单意图 → add_to_cart（内部复用 CartAgent）
        //   - 菜品咨询 → query_dish / search_dish_knowledge
        //   - 闲聊 → 直接回复
        // 前端不再做关键词判断，一个入口、一个会话历史。

        async function sendCustom() {
            const input = document.getElementById('orderInput');
            const text = input.value.trim();
            if (!text) return;
            appendMessage('user', text);
            input.value = '';
            // 统一走 /api/ai/chat，LLM 识别意图（推荐/加购/咨询/闲聊）
            await sendChat(text);
        }

        // 普通对话发送（复用 /api/ai/chat）
        async function sendChat(message) {
            const loadingBubble = appendMessage('loading', '正在思考...');
            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_message: message,
                        session_id: sessionId,
                        session_token: sessionToken
                    })
                });
                if (resp.status === 401) {
                    sessionId = ''; sessionToken = '';
                    loadingBubble.textContent = '会话已过期，请重新推荐';
                    loadingBubble.parentElement.classList.remove('loading');
                    loadingBubble.parentElement.classList.add('error');
                    return;
                }
                if (!resp.ok) {
                    loadingBubble.textContent = `请求失败 (HTTP ${resp.status})`;
                    loadingBubble.parentElement.classList.remove('loading');
                    loadingBubble.parentElement.classList.add('error');
                    return;
                }
                const data = await resp.json();
                if (data.session_id) sessionId = data.session_id;
                if (data.session_token) sessionToken = data.session_token;
                const content = data.aimessage || data.content || data.message || '';
                loadingBubble.innerHTML = formatAssistantHtml(String(content));
                loadingBubble.parentElement.classList.remove('loading');
                loadingBubble.parentElement.classList.add('assistant');
            } catch (err) {
                loadingBubble.textContent = '网络错误：' + err.message;
                loadingBubble.parentElement.classList.remove('loading');
                loadingBubble.parentElement.classList.add('error');
            }
        }

        async function resetAll() {
            // 仅当存在已签发会话时才调用后端 reset（reset 要求 session_id + session_token）
            if (sessionId && sessionToken) {
                try {
                    await fetch(RESET_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: sessionId,
                            session_token: sessionToken
                        })
                    });
                } catch (e) { /* 静默失败 */ }
            }
            // 清空凭证：下一次 chat 由后端重新签发新会话与新 token
            sessionId = '';
            sessionToken = '';
            state.step = 1;
            state.people = '';
            state.spicy = '';
            state.prefs.clear();
            state.submitted = false;
            chatArea.innerHTML = '<div class="empty">选择下方选项，开始定制你的菜单</div>';
            renderStep();
        }

        // 初始化
        renderStep();
    </script>
</body>
</html>
